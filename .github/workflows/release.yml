name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, platform: win32, arch: x64, os: win }
          - { runner: windows-11-arm, platform: win32, arch: arm64, os: win }
          - { runner: macos-15-intel, platform: darwin, arch: x64, os: mac }
          - { runner: macos-15, platform: darwin, arch: arm64, os: mac }
          - { runner: ubuntu-24.04, platform: linux, arch: x64, os: linux }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, os: linux }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Install Linux packaging and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools libgtk-3-0t64 libnss3 libasound2t64 xvfb xauth
      - run: npm ci
      - run: npm test
      - name: Package offline installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Check Windows package and bundled Pandoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'Sujian-*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Missing Windows installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'Sujian-install'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          $app = Join-Path $destination 'Sujian.exe'
          & (Join-Path $destination 'resources/pandoc/pandoc.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smoke = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }
      - name: Check macOS package and bundled Pandoc
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmgs=(release/Sujian-*.dmg)
          dmg="${dmgs[0]}"
          test -f "$dmg"
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Sujian.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/pandoc/pandoc" --version
          "$app/Contents/MacOS/Sujian" --smoke-test
      - name: Check Linux package and bundled Pandoc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image=$(find release -maxdepth 1 -name 'Sujian-*.AppImage' -print -quit)
          deb=$(find release -maxdepth 1 -name 'Sujian-*.deb' -print -quit)
          test -n "$image" && test -n "$deb"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$image" --no-sandbox --smoke-test
          staging=$(mktemp -d)
          dpkg-deb -x "$deb" "$staging"
          "$staging/opt/Sujian/resources/pandoc/pandoc" --version
          xvfb-run -a "$staging/opt/Sujian/sujian" --no-sandbox --smoke-test
      - name: Check installer outputs
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          version=$(node -p 'require("./package.json").version')
          base="release/Sujian-${version}-${TARGET_OS}-${TARGET_ARCH}"
          case "$TARGET_OS" in
            win) test -s "$base.exe" ;;
            mac) test -s "$base.dmg" ;;
            linux)
              image_arch="$TARGET_ARCH"
              deb_arch="$TARGET_ARCH"
              if [ "$TARGET_ARCH" = x64 ]; then
                image_arch=x86_64
                deb_arch=amd64
              fi
              test -s "release/Sujian-${version}-linux-${image_arch}.AppImage"
              test -s "release/Sujian-${version}-linux-${deb_arch}.deb"
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: Sujian-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/Sujian-*.exe
            release/Sujian-*.dmg
            release/Sujian-*.AppImage
            release/Sujian-*.deb

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: Sujian-*
          path: release
          merge-multiple: true
      - name: Include corresponding Pandoc source and installer hashes
        shell: bash
        run: |
          node scripts/prepare-pandoc.mjs --source release
          cd release
          sha256sum Sujian-* pandoc-*-source.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --draft --verify-tag --generate-notes --title "Sujian $tag"
          fi
          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false
